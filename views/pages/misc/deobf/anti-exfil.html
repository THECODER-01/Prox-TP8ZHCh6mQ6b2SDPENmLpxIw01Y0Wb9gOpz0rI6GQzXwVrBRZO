{{ifDisguise}}{{<div class="max-w-md mx-auto bg-gray-900 p-6 rounded-lg shadow">
  <h2 class="text-xl font-semibold text-white mb-4">Site Login</h2>
  <p class="text-sm text-gray-300 mb-4">This site is protected. Enter the password to continue.</p>
  <form id="password-field" method="post" action="{{route}}{{/login}}" class="flex flex-col space-y-2">
    <label for="pwd" class="text-sm font-medium text-gray-200">Password</label>
    <input type="password" autocomplete="current-password" id="pwd" name="pwd" placeholder="********" class="px-4 py-2 border border-gray-700 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-800 text-white" required />
    <button type="submit" class="mt-2 px-4 py-2 bg-blue-600 text-white rounded">Login</button>
  </form>
  <script>(function(){if(new URLSearchParams(location.search).get('bad')){const f=document.getElementById('password-field');const err=document.createElement('p');err.textContent='Invalid password';err.style.color='red';f.prepend(err);}})();</script>
</div>}}
