<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Notes</title>
    <style>body{font-family:system-ui,Arial;max-width:900px;margin:20px}</style>
  </head>
  <body>
    <h1>Notes</h1>
    <form id="add">
      <textarea name="text" rows="4" cols="80" placeholder="Write a note..." required></textarea><br />
      <button>Post</button>
    </form>
    <ul id="notes">Loading…</ul>
    <script>
      function cookieValue(name) { return document.cookie.split(';').map(c=>c.trim()).find(c=>c.startsWith(name+'='))?.split('=')[1]; }
      async function fetchJSON(path, opts={}) {
        if (!opts.headers) opts.headers = {};
        const csrf = cookieValue('csrf-token');
        if (csrf) opts.headers['X-CSRF-Token'] = decodeURIComponent(csrf);
        const res = await fetch(path, opts);
        if (!res.ok) throw new Error('Fetch error ' + res.status);
        return res.json();
      }
      async function load(){
        const j = await fetchJSON('/api/notes');
        const ul = document.getElementById('notes');
        ul.innerHTML='';
        j.notes.forEach(n=>{
          const li = document.createElement('li');
          li.textContent = `[${n.username}] ${n.text} `;
          const btn = document.createElement('button'); btn.textContent='Delete';
          btn.addEventListener('click', async ()=>{
            if (!confirm('Delete?')) return;
            await fetchJSON(`/api/notes/${n.id}/delete`, { method: 'POST' });
            load();
          });
          li.appendChild(btn);
          ul.appendChild(li);
        });
      }
      document.getElementById('add').addEventListener('submit', async (e)=>{
        e.preventDefault();
        const data = new FormData(e.currentTarget);
        const body = new URLSearchParams([...data.entries()]);
        await fetchJSON('/api/notes', { method: 'POST', body });
        e.currentTarget.reset();
        load();
      });
      load().catch((e)=>{ console.error(e); });
    </script>
  </body>
</html>
